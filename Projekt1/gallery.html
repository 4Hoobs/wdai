<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="js/load.js" defer></script>
</head>

<body>
    <header>
        <div id="nav-placeholder"></div>
        <h1 class="index">Gallery</h1>
    </header>
    <main>
        <div id="social-placeholder"></div>
        <section>
            <div class="gallery">
                <img src="images/dave.png" alt="Dave" />
                <img src="images/facebook.png" alt="Facebook icon" />
                <img src="images/hal.png" alt="Hal" />
                <img src="images/keyboard.jpg" alt="Keyboard" />
                <img src="images/moon.png" alt="Moon" />
                <img src="images/rover.png" alt="Rover" />
                <img src="images/tim-cook.png" alt="Tim Cook" />
                <img src="images/zoom.png" alt="Zoom logo" />
            </div>
            <video class="gallery-video" controls width="640">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </section>
    </main>
    <div id="footer-placeholder"></div>
</body>

</html>
