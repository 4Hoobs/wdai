<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Contact us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li>
            <a href="index.html"
              ><img class="logo" src="icons/Logo.png" alt="Logo"
            /></a>
          </li>
          <li><a class="website-links" href="space.html">Space</a></li>
          <li><a class="website-links" href="tech.html">Technology</a></li>
          <li>
            <a class="website-links" href="contact-us.html">Contact us</a>
          </li>
          <li><a class="website-links" href="about-us.html">About us</a></li>
        </ul>
      </nav>
      <h1 class="index">Contact us!</h1>
    </header>
    <main>
      <div class="social-links">
        <a href="https://www.facebook.com/"
          ><img src="icons/Facebook.svg" alt="facebook"
        /></a>
        <a href="https://twitter.com/explore"
          ><img src="icons/Twitter.svg" alt="twitter"
        /></a>
        <a href="https://www.reddit.com"
          ><img src="icons/Reddit.svg" alt="reddit"
        /></a>
      </div>
      <section>
        <form action="" class="contact_form">
          <input
            type="text"
            placeholder="Name goes here"
            name=""
            id="contact-name"
          />
          <input
            type="email"
            placeholder="Email goes here"
            name=""
            id="contact-email"
          />
          <textarea
            name=""
            placeholder="Message goes here"
            id="contact-message"
            cols="30"
            rows="10"
          ></textarea>
          <button id="contact-send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <footer>
      Leisure Learning &copy; 2020
    </footer>
  </body>
</html>
