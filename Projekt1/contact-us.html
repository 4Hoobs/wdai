<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
    <script src="js/load.js" defer></script>
    <script src="js/form.js" defer></script>
    <title>Contact us</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div id="nav-placeholder"></div>
        <h1 class="index">Contact us!</h1>
    </header>
    <main>
        <div id="social-placeholder"></div>
        <section>
            <form action="" class="contact_form">
                <label for="contact-name">Name</label>
                <input type="text" placeholder="Name goes here" name="" id="contact-name" required/>
                <label for="contact-email">Email</label>
                <input type="email" placeholder="Email goes here" name="" id="contact-email" required/>
                <label for="contact-subject">Subject</label>
                <select id="contact-subject" required>
                    <option value="" disabled selected>Select a subject</option>
                    <option value="general">General inquiry</option>
                    <option value="support">Support / technical help</option>
                    <option value="feedback">Feedback / suggestions</option>
                    <option value="careers">Career opportunities</option>
                    <option value="partnerships">Partnership / collaboration</option>
                    <option value="press">Press or media request</option>
                    <option value="other">Other</option>
                </select>

                <label for="contact-message">Message</label>
                <textarea name="" placeholder="Message goes here" id="contact-message" cols="30" rows="10" required></textarea>
                <button id="contact-send" type="submit">Send</button>
            </form>
        </section>
    </main>
    <div id="footer-placeholder"></div>
</body>

</html>
