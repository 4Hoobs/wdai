<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .grid {
            display: grid;
            grid-auto-flow: row;
            row-gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .square {
            height: 100px;
            width: 100px;
        }
    </style>
    <title>Ex3</title>
</head>

<body>
    <div class="grid">
        <div class="row">
            <div class="square" style="background-color:darkorange;"></div>
            <div class="square" style="background-color:seagreen;"></div>
        </div>
        <div class="row">
            <div class="square" style="background-color: aquamarine;"></div>
            <img class="square" src="img/images.jpg">
            <div class="square" style="background-color:crimson;"></div>

        </div>
    </div>


</body>

</html>
